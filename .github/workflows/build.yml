name: Build Half-Life DLLs

on:
  pull_request:
    branches:
      - master

jobs:
  build-windows-client:
    name: Windows x86 Client DLL
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows Client DLL
        run: >
          msbuild projects/vs2019/hl_cdll.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /m

      - name: Verify architecture
        shell: pwsh
        run: |
          $dll = "projects/vs2019/Release/hl_cdll/client.dll"
          if (-not (Test-Path $dll)) {
            throw "Client DLL was not produced: $dll"
          }

      - name: Upload Windows Client DLL
        uses: actions/upload-artifact@v4
        with:
          name: client-windows-x86
          path: projects/vs2019/Release/hl_cdll/client.dll

  build-windows-server:
    name: Windows x86 Server DLL
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows Server DLL
        run: >
          msbuild projects/vs2019/hldll.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /m

      - name: Verify output
        shell: pwsh
        run: |
          $dll = "projects/vs2019/Release/hldll/hl.dll"
          if (-not (Test-Path $dll)) {
            throw "Server DLL was not produced: $dll"
          }

      - name: Upload Windows Server DLL
        uses: actions/upload-artifact@v4
        with:
          name: hl-windows-x86
          path: projects/vs2019/Release/hldll/hl.dll

  build-linux-client:
    name: Linux x86 Client DLL
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            make

      - name: Build Linux Client DLL
        working-directory: linux
        run: |
          make hl_cdll \
            ARCH_CFLAGS_I486="-m32" \
            ARCH_CFLAGS_I686="-m32" \
            ARCH_CFLAGS_AMD="-m32" \
            ARCH_CFLAGS_AMD64="-m32" \
            HL_OUTPUT_DIR=release \
            CREATE_OUTPUT_DIRS=1

      - name: Verify architecture
        run: |
          file linux/release/cl_dlls/client.so
          file linux/release/cl_dlls/client.so | grep -q "ELF 32-bit"

      - name: Upload Linux Client DLL
        uses: actions/upload-artifact@v4
        with:
          name: client-linux-x86
          path: linux/release/cl_dlls/client.so

  build-linux-server:
    name: Linux x86 Server DLL
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            make

      - name: Build Linux Server DLL
        working-directory: linux
        run: |
          make hl \
            ARCH_CFLAGS_I486="-m32" \
            ARCH_CFLAGS_I686="-m32" \
            ARCH_CFLAGS_AMD="-m32" \
            ARCH_CFLAGS_AMD64="-m32" \
            HL_OUTPUT_DIR=release \
            CREATE_OUTPUT_DIRS=1

      - name: Verify architecture
        run: |
          file linux/release/dlls/hl.so
          file linux/release/dlls/hl.so | grep -q "ELF 32-bit"

      - name: Upload Linux Server DLL
        uses: actions/upload-artifact@v4
        with:
          name: hl-linux-x86
          path: linux/release/dlls/hl.so
