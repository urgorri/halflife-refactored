name: Auto-Format Entire Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    name: Format C/C++ files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch all history so we don't have shallow clone issues
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Format all C/C++ files
        run: |
          # Find and format all C/C++ source and header files
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" -o -name "*.hpp" -o -name "*.cc" -o -name "*.cxx" \) -not -path '*/.*' -exec clang-format -i {} +

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Stage all modified files
          git add -A

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No files needed formatting."
          else
            echo "Committing formatted files..."
            git commit -m "style: apply clang-format to entire repository"
            git push origin HEAD:${{ github.ref }}
          fi
